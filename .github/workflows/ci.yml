name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, vet and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the merge result
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Tracks the go directive in go.mod so this workflow never drifts
          # from the version the module declares.
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "These files need gofmt:"
            echo "$files" | sed 's/^/  /'
            echo ""
            echo "Run: gofmt -w ."
            exit 1
          fi

      - name: Build
        run: go build ./...

      # go build does not compile _test.go files, so it alone cannot catch a
      # test package that no longer matches a changed signature. go vet
      # type-checks test files, which is what makes this step load-bearing.
      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -race

  ui-e2e:
    name: UI end-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the merge result
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/e2e/package-lock.json

      - name: Install dependencies
        working-directory: ui/e2e
        run: npm ci

      - name: Install Chromium
        working-directory: ui/e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: ui/e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ui/e2e/playwright-report/
            ui/e2e/test-results/
          retention-days: 7
