tenant: acme
agents:
  - name: ceo
    role: ceo
    provider: claude-code
    model: anthropic/claude-sonnet-4-20250514
  - name: worker
    role: engineer
    provider: opencode
    model: openai/gpt-4o
gateways:
  telegram:
    token_env: TELEGRAM_BOT_TOKEN
    recipient_env: TELEGRAM_OWNER_ID
risk_policy:
  telegram_send:
    risk: risky
    allowed_roles: [ceo]
