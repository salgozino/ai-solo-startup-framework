tenant: acme
auth_token_env: A2A_AUTH_TOKEN
agents:
  - name: ceo
    role: ceo
    provider: claude-code
    gateways:
      telegram:
        token_env: TELEGRAM_BOT_TOKEN
gateways:
  telegram:
    token_env: TELEGRAM_BOT_TOKEN
    recipient_env: TELEGRAM_OWNER_ID
risk_policy:
  telegram_send:
    risk: risky
    allowed_roles: [ceo]
