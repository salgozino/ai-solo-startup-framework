# openspec/config.yaml
# SDD configuration for: ai-solo-startup-framework
# Initialized: 2026-08-28
# Mode: hybrid (OpenSpec files + Engram)
schema: spec-driven

context: |
  Project: ai-solo-startup-framework
  Stack: Go 1.25.0 — company definitions in YAML, agent skills in Markdown
  Architecture: ports-and-adapters; A2A protocol (a2a-go SDK v2.5.0) for agent communication;
    multi-agent framework (CEO, CTO, engineer, designer roles) supervised in-process
  Testing: `go test ./...` — strict TDD is mandatory for this project
  Git: initialized; remote origin at github.com/salgozino/ai-solo-startup-framework
  CI: required check "Build, vet and test" — gofmt, go build, go vet, go test -race
  Delivery: auto-chain | review_budget_lines: 400

testing:
  strict_tdd: true
  reason: "Go toolchain present with tests across core, adapters, transport, gateways, ui and cmd."
  test_runner: "go test ./..."
  unit: true
  integration: true
  e2e: true
  coverage: true
  linter: true
  type_checker: true
  formatter: true

sdd:
  execution_mode: interactive
  artifact_store: both
  delivery_strategy: auto-chain
  review_budget_lines: 400
  initialized: 2026-08-28

rules:
  proposal:
    - Include rollback plan for risky changes
    - State which agent roles are affected by the change
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Reference agent role(s) and protocol(s) in each requirement
  design:
    - Include sequence diagrams for agent communication flows
    - Document protocol choices (AMP, AAP, AgentIDs) with rationale
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing ports-and-adapters patterns; keep core free of transport details
      - Run gofmt before finishing; CI enforces formatting
    tdd: true
    test_command: "go test ./..."
  verify:
    test_command: "go test ./... -count=1 -race"
    build_command: "go build ./..."
    vet_command: "go vet ./..."
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
